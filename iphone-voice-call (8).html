<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPhone Voice Call</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at 30% 20%, #1a1a2e 0%, #0d0d1a 60%, #000 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    overflow: hidden;
  }

  /* Ambient glow behind phone */
  .ambient {
    position: absolute;
    width: 340px;
    height: 680px;
    border-radius: 60px;
    background: radial-gradient(ellipse, rgba(120,120,255,0.15) 0%, transparent 70%);
    filter: blur(40px);
    pointer-events: none;
  }

  /* iPhone shell */
  .iphone {
    position: relative;
    width: 320px;
    height: 650px;
    background: linear-gradient(160deg, #2a2a2a 0%, #1a1a1a 40%, #111 100%);
    border-radius: 54px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.08),
      0 0 0 2px rgba(0,0,0,0.9),
      0 30px 80px rgba(0,0,0,0.8),
      inset 0 1px 0 rgba(255,255,255,0.12);
  }

  /* Side buttons */
  .btn-side {
    position: absolute;
    background: linear-gradient(90deg, #222, #2e2e2e);
    border-radius: 3px;
  }
  .btn-power {
    right: -3px; top: 160px;
    width: 4px; height: 70px;
    box-shadow: inset -1px 0 rgba(255,255,255,0.05);
  }
  .btn-vol-up {
    left: -3px; top: 130px;
    width: 4px; height: 40px;
  }
  .btn-vol-down {
    left: -3px; top: 182px;
    width: 4px; height: 40px;
  }
  .btn-mute {
    left: -3px; top: 90px;
    width: 4px; height: 28px;
  }

  /* Screen */
  .screen {
    position: absolute;
    inset: 8px;
    border-radius: 46px;
    overflow: hidden;
    background: #000;
  }

  /* Wallpaper */
  .wallpaper {
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
  }

  .wallpaper::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 30% 70%, rgba(99,54,200,0.4) 0%, transparent 50%),
      radial-gradient(circle at 70% 30%, rgba(36,100,180,0.3) 0%, transparent 50%);
  }

  /* Dynamic Island */
  .dynamic-island {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 34px;
    background: #000;
    border-radius: 20px;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .dynamic-island.active {
    width: 200px;
    height: 38px;
  }

  .di-camera {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #1a1a1a;
    border: 1px solid #222;
    position: relative;
  }
  .di-camera::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 5px; height: 5px;
    border-radius: 50%;
    background: rgba(50,50,80,0.8);
  }

  .di-call-indicator {
    display: none;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #4ade80;
    font-weight: 500;
  }

  .dynamic-island.active .di-call-indicator { display: flex; }

  .di-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #4ade80;
    animation: pulse-green 1.2s ease-in-out infinite;
  }

  @keyframes pulse-green {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.7); }
  }

  /* Status bar */
  .status-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 58px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 28px 6px;
    z-index: 5;
  }

  .status-time {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    letter-spacing: -0.3px;
  }

  .status-icons {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .signal-bars {
    display: flex; gap: 2px; align-items: flex-end;
  }
  .signal-bars span {
    width: 3px;
    background: #fff;
    border-radius: 1px;
  }
  .signal-bars span:nth-child(1) { height: 4px; }
  .signal-bars span:nth-child(2) { height: 6px; }
  .signal-bars span:nth-child(3) { height: 9px; }
  .signal-bars span:nth-child(4) { height: 12px; }

  .wifi-icon {
    width: 15px; height: 11px;
    position: relative;
    overflow: visible;
  }

  .battery {
    display: flex; align-items: center; gap: 2px;
  }
  .battery-body {
    width: 22px; height: 11px;
    border: 1.5px solid rgba(255,255,255,0.7);
    border-radius: 3px;
    padding: 1.5px;
    position: relative;
  }
  .battery-fill {
    height: 100%;
    width: 75%;
    background: #4ade80;
    border-radius: 1px;
  }
  .battery-tip {
    width: 2px; height: 5px;
    background: rgba(255,255,255,0.5);
    border-radius: 0 1px 1px 0;
  }

  /* Call screen content */
  .call-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 90px;
    z-index: 2;
  }

  /* Idle screen */
  .idle-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 90px;
    z-index: 2;
    transition: opacity 0.5s ease;
  }

  .idle-screen.hidden { opacity: 0; pointer-events: none; }
  .call-screen.hidden { opacity: 0; pointer-events: none; }

  /* Contact avatar */
  .avatar-wrap {
    position: relative;
    margin-bottom: 16px;
  }

  .avatar-ring {
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.15);
    animation: ring-pulse 2s ease-in-out infinite;
  }

  .avatar-ring-2 {
    position: absolute;
    inset: -16px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.07);
    animation: ring-pulse 2s ease-in-out infinite 0.4s;
  }

  @keyframes ring-pulse {
    0%, 100% { transform: scale(1); opacity: 0.7; }
    50% { transform: scale(1.04); opacity: 0.3; }
  }

  .avatar {
    width: 90px; height: 90px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 600;
    color: #fff;
    letter-spacing: -1px;
    position: relative;
    z-index: 1;
  }

  .contact-name {
    font-size: 28px;
    font-weight: 600;
    color: #fff;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }

  .contact-status {
    font-size: 14px;
    color: rgba(255,255,255,0.55);
    margin-bottom: 4px;
  }

  /* Call timer */
  .call-timer {
    font-size: 16px;
    color: rgba(255,255,255,0.7);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }

  /* Action buttons grid */
  .action-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    padding: 0 24px;
    margin-top: auto;
    margin-bottom: 24px;
    width: 100%;
  }

  .action-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    cursor: pointer;
  }

  .action-icon {
    width: 58px; height: 58px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, background 0.15s;
    backdrop-filter: blur(10px);
  }

  .action-icon.active-state {
    background: rgba(255,255,255,0.92);
  }

  .action-btn:hover .action-icon { background: rgba(255,255,255,0.2); }
  .action-btn:active .action-icon { transform: scale(0.92); }

  .action-icon svg { width: 24px; height: 24px; }

  .action-label {
    font-size: 12px;
    color: rgba(255,255,255,0.7);
    font-weight: 400;
  }

  /* Main call/end buttons */
  .call-buttons {
    display: flex;
    justify-content: space-around;
    align-items: center;
    width: 100%;
    padding: 0 30px;
    margin-bottom: 40px;
  }

  .btn-call-main {
    width: 70px; height: 70px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, box-shadow 0.15s;
    position: relative;
  }

  .btn-call-main:active { transform: scale(0.92); }

  .btn-answer {
    background: #34C759;
    box-shadow: 0 0 24px rgba(52,199,89,0.5);
  }

  .btn-decline {
    background: #FF3B30;
    box-shadow: 0 0 24px rgba(255,59,48,0.5);
  }

  .btn-end {
    background: #FF3B30;
    box-shadow: 0 4px 20px rgba(255,59,48,0.6);
    width: 72px; height: 72px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s;
    margin: 0 auto;
  }
  .btn-end:active { transform: scale(0.92); }

  /* Incoming call screen */
  .incoming-row {
    display: flex;
    justify-content: space-around;
    align-items: flex-start;
    width: 100%;
    padding: 0 16px;
    margin-top: 16px;
  }
  .incoming-action {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .incoming-action span {
    font-size: 12px; color: rgba(255,255,255,0.6);
  }

  /* Active call controls */
  .active-call-controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    margin-top: auto;
    padding-bottom: 36px;
    gap: 20px;
  }

  /* Waveform animation */
  .waveform {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 32px;
  }

  .wave-bar {
    width: 3px;
    background: rgba(255,255,255,0.6);
    border-radius: 2px;
    animation: wave 1.2s ease-in-out infinite;
  }

  .wave-bar:nth-child(1) { animation-delay: 0s; height: 8px; }
  .wave-bar:nth-child(2) { animation-delay: 0.1s; height: 20px; }
  .wave-bar:nth-child(3) { animation-delay: 0.2s; height: 28px; }
  .wave-bar:nth-child(4) { animation-delay: 0.3s; height: 14px; }
  .wave-bar:nth-child(5) { animation-delay: 0.15s; height: 24px; }
  .wave-bar:nth-child(6) { animation-delay: 0.25s; height: 10px; }
  .wave-bar:nth-child(7) { animation-delay: 0.05s; height: 18px; }

  @keyframes wave {
    0%, 100% { transform: scaleY(0.4); opacity: 0.5; }
    50% { transform: scaleY(1); opacity: 1; }
  }

  /* Home indicator */
  .home-indicator {
    position: absolute;
    bottom: 10px;
    left: 50%; transform: translateX(-50%);
    width: 120px; height: 5px;
    background: rgba(255,255,255,0.25);
    border-radius: 3px;
    z-index: 10;
  }

  /* ElevenLabs widget — always hidden */
  elevenlabs-convai { display: none !important; }
  elevenlabs-convai-orig {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  elevenlabs-convai.visible-DISABLED {
    opacity: 1;
    pointer-events: all;
    z-index: 100;
  }

  /* Incoming call pulse rings */
  .pulse-rings {
    position: absolute;
    inset: -30px;
    pointer-events: none;
  }
  .pulse-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(74,222,128,0.4);
    animation: pulse-out 2s ease-out infinite;
  }
  .pulse-ring:nth-child(2) { animation-delay: 0.6s; }
  .pulse-ring:nth-child(3) { animation-delay: 1.2s; }

  @keyframes pulse-out {
    0% { transform: scale(0.8); opacity: 0.8; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  /* Notch shimmer */
  .screen::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
    z-index: 20;
  }
</style>
</head>
<body>

<div class="ambient"></div>

<!-- iPhone -->
<div class="iphone">
  <!-- Physical buttons -->
  <div class="btn-side btn-mute"></div>
  <div class="btn-side btn-vol-up"></div>
  <div class="btn-side btn-vol-down"></div>
  <div class="btn-side btn-power"></div>

  <!-- Screen -->
  <div class="screen">
    <div class="wallpaper"></div>

    <!-- Dynamic Island -->
    <div class="dynamic-island" id="dynamicIsland">
      <div class="di-camera"></div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
      <div class="status-time" id="statusTime">9:41</div>
      <div class="status-icons">
        <div class="signal-bars">
          <span></span><span></span><span></span><span></span>
        </div>
        <svg class="wifi-icon" viewBox="0 0 15 11" fill="none">
          <path d="M7.5 10L7.5 10" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <path d="M5.2 7.8C6.0 7.0 8.0 7.0 9.8 7.8" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M2.8 5.5C4.5 3.8 10.5 3.8 12.2 5.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M0.5 3.2C3.0 0.8 12.0 0.8 14.5 3.2" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <div class="battery">
          <div class="battery-body"><div class="battery-fill"></div></div>
          <div class="battery-tip"></div>
        </div>
      </div>
    </div>

    <!-- INCOMING CALL SCREEN -->
    <div class="idle-screen" id="incomingScreen">
      <div style="margin-bottom:8px; font-size:13px; color:rgba(255,255,255,0.5); font-weight:500; letter-spacing:0.5px; text-transform:uppercase;">Calling...</div>

      <div class="avatar-wrap" style="margin-top:12px;">
        <div class="pulse-rings">
          <div class="pulse-ring"></div>
          <div class="pulse-ring"></div>
          <div class="pulse-ring"></div>
        </div>
        <div class="avatar">AI</div>
      </div>

      <div class="contact-name" style="margin-top:30px;">+966 55 348 7291</div>
      

      <div style="margin-top: auto; width:100%; padding-bottom:50px;">
        <div class="incoming-row">
          <!-- Decline -->
          <div class="incoming-action">
            <button class="btn-call-main btn-decline" onclick="declineCall()" aria-label="Decline call">
              <svg viewBox="0 0 24 24" fill="white" width="30" height="30" xmlns="http://www.w3.org/2000/svg">
                <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z" transform="rotate(135, 12, 12)"/>
              </svg>
            </button>
            <span>Decline</span>
          </div>
          <!-- Answer -->
          <div class="incoming-action">
            <button class="btn-call-main btn-answer" id="answerBtn" onclick="answerCall()" aria-label="Answer call">
              <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="28" height="28">
                <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 8.63 19.79 19.79 0 01.47 4.18 2 2 0 012.44 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 9.91a16 16 0 006.79 6.79l1.78-1.78a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
              </svg>
            </button>
            <span>Answer</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ACTIVE CALL SCREEN -->
    <div class="call-screen hidden" id="activeScreen">
      <div style="font-size:13px; color:rgba(255,255,255,0.5); font-weight:500; letter-spacing:0.5px; text-transform:uppercase; margin-bottom:8px;">Active Call</div>

      <div class="avatar-wrap" style="margin-top:8px;">
        <div class="avatar-ring"></div>
        <div class="avatar-ring-2"></div>
        <div class="avatar">AI</div>
      </div>

      <div class="contact-name" style="margin-top:28px;">+966 55 348 7291</div>
      
      <div class="call-timer" id="callTimer" style="display:none;">0:00</div>

      <div class="waveform" style="margin-top:12px;">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>

      <!-- Action buttons -->
      <div class="action-grid" style="margin-top:28px;">
        <div class="action-btn" onclick="toggleAction(this, 'mute')">
          <div class="action-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="1" y1="1" x2="23" y2="23" id="mute-slash" style="display:none"/>
              <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
              <path d="M19 10v2a7 7 0 01-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
          </div>
          <span class="action-label">mute</span>
        </div>

        <div class="action-btn" onclick="toggleAction(this, 'keypad')">
          <div class="action-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="4" height="4" rx="1"/><rect x="10" y="3" width="4" height="4" rx="1"/><rect x="17" y="3" width="4" height="4" rx="1"/>
              <rect x="3" y="10" width="4" height="4" rx="1"/><rect x="10" y="10" width="4" height="4" rx="1"/><rect x="17" y="10" width="4" height="4" rx="1"/>
              <rect x="3" y="17" width="4" height="4" rx="1"/><rect x="10" y="17" width="4" height="4" rx="1"/><rect x="17" y="17" width="4" height="4" rx="1"/>
            </svg>
          </div>
          <span class="action-label">keypad</span>
        </div>

        <div class="action-btn" onclick="toggleAction(this, 'speaker')">
          <div class="action-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/>
            </svg>
          </div>
          <span class="action-label">speaker</span>
        </div>

        <div class="action-btn" onclick="toggleAction(this, 'add')">
          <div class="action-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/>
              <line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/>
            </svg>
          </div>
          <span class="action-label">add call</span>
        </div>

        <div class="action-btn" onclick="toggleAction(this, 'facetime')">
          <div class="action-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="23 7 16 12 23 17 23 7"/>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
            </svg>
          </div>
          <span class="action-label">facetime</span>
        </div>

        <div class="action-btn" onclick="toggleAction(this, 'contacts')">
          <div class="action-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 00-3-3.87m-4-12a4 4 0 010 7.75"/>
            </svg>
          </div>
          <span class="action-label">contacts</span>
        </div>
      </div>

      <!-- End call -->
      <div style="margin-top:auto; margin-bottom:32px; display:flex; flex-direction:column; align-items:center; gap:8px;">
        <button class="btn-end" onclick="endCall()" aria-label="End call">
          <svg viewBox="0 0 24 24" fill="white" width="30" height="30" xmlns="http://www.w3.org/2000/svg">

<!-- ElevenLabs Widget (hidden, triggered on call answer) -->
<elevenlabs-convai agent-id="agent_7301kte31e38ff982d1d4ptfegb8" id="elevenWidget"></elevenlabs-convai>
<script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>

<script>
  let callSeconds = 0;
  let timerInterval = null;
  let inCall = false;

  // Live clock
  function updateClock() {
    const now = new Date();
    let h = now.getHours(), m = now.getMinutes();
    const ampm = h >= 12 ? '' : '';
    h = h % 12 || 12;
    document.getElementById('statusTime').textContent = `${h}:${m.toString().padStart(2,'0')}`;
  }
  updateClock();
  setInterval(updateClock, 10000);

  function answerCall() {
    inCall = true;
    document.getElementById('incomingScreen').classList.add('hidden');
    document.getElementById('activeScreen').classList.remove('hidden');
    document.getElementById('dynamicIsland').classList.add('active');

    // Start call timer
    callSeconds = 0;
    timerInterval = setInterval(() => {
      callSeconds++;
      const m = Math.floor(callSeconds / 60);
      const s = callSeconds % 60;
      document.getElementById('callTimer').textContent = `${m}:${s.toString().padStart(2,'0')}`;
    }, 1000);

    // Show ElevenLabs widget and start conversation
    const widget = document.getElementById('elevenWidget');
    widget.classList.add('visible');

    // Auto-click the widget to start the call after it loads
    setTimeout(() => {
      const shadow = widget.shadowRoot;
      if (shadow) {
        const btn = shadow.querySelector('button');
        if (btn) btn.click();
      }
    }, 800);
  }

  function declineCall() {
    document.getElementById('incomingScreen').style.opacity = '0';
    document.getElementById('incomingScreen').style.transform = 'translateY(20px)';
    document.getElementById('incomingScreen').style.transition = 'all 0.4s ease';
    setTimeout(() => {
      document.getElementById('incomingScreen').style.opacity = '1';
      document.getElementById('incomingScreen').style.transform = '';
    }, 1500);
  }

  function endCall() {
    inCall = false;
    clearInterval(timerInterval);

    document.getElementById('activeScreen').classList.add('hidden');
    document.getElementById('dynamicIsland').classList.remove('active');

    // Hide ElevenLabs widget
    const widget = document.getElementById('elevenWidget');
    widget.classList.remove('visible');

    // Return to incoming screen after brief pause
    setTimeout(() => {
      document.getElementById('incomingScreen').classList.remove('hidden');
    }, 600);
  }

  function toggleAction(el, name) {
    const icon = el.querySelector('.action-icon');
    icon.classList.toggle('active-state');
    const svgs = icon.querySelectorAll('svg');
    svgs.forEach(svg => {
      svg.querySelectorAll('line, path, polygon').forEach(el => {
        if (icon.classList.contains('active-state')) {
          el.style.stroke = '#1a1a1a';
        } else {
          el.style.stroke = 'white';
        }
      });
    });
  }
</script>

</body>
